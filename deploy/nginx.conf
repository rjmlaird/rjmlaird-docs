# Server block for the built site. Copy dist/ to /var/www/docs and include the generated snippets.
server {
    listen 443 ssl http2;
    server_name docs.rjmlaird.co.uk;
    # ssl_certificate / ssl_certificate_key: managed outside this repository
    root /var/www/docs;
    index index.html;
    server_tokens off;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    include /etc/nginx/docs/security-headers.nginx.conf;   # from deploy/generated/
    include /etc/nginx/docs/redirects.nginx.conf;

    location /_astro/ { add_header Cache-Control "public, max-age=31536000, immutable" always; include /etc/nginx/docs/security-headers.nginx.conf; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
