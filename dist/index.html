<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ryan Laird Docs</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem; max-width: 1100px; }
    h1 { margin-top: 0; }
    .tree { line-height: 1.6; }
    details { margin-left: 1rem; }
    summary { cursor: pointer; }
    a { text-decoration: none; }
    a:hover { text-decoration: underline; }
    .file { margin-left: 1.5rem; display: block; }
    .folder-label { font-weight: 600; }
    .path { opacity: .7; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>Ryan Laird Docs</h1>
  <p>Certificates and documents.</p>
  <div id="app">Loading…</div>

  <script>
    const icon = (t) => t === 'folder' ? '📁' : '📄';

    function renderNode(node, base = '') {
      if (node.type === 'file') {
        const url = encodeURI(node.path);
        return `<a class="file" href="${url}" target="_blank" rel="noopener">${icon('file')} ${node.name}</a>`;
      }

      const children = node.children.map(child => renderNode(child, node.path)).join('');
      return `
        <details open>
          <summary class="folder-label">${icon('folder')} ${node.name}</summary>
          <div class="path">${node.path}</div>
          <div style="margin-left: 1rem;">${children}</div>
        </details>
      `;
    }

    fetch('files.json')
      .then(r => r.json())
      .then(data => {
        const tree = data.tree.map(n => renderNode(n)).join('');
        document.getElementById('app').innerHTML = `<div class="tree">${tree}</div>`;
      })
      .catch(err => {
        document.getElementById('app').textContent = 'Failed to load files.json: ' + err.message;
      });
  </script>
</body>
</html>
